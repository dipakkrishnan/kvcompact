[project]
name = "kvcompact"
version = "0.1.0"
description = "KV-cache compaction vs summary compaction at the context limit"
readme = "README.md"
authors = [
    { name = "Dipak Krishnan" }
]
requires-python = ">=3.12"
dependencies = [
    "torch==2.*",
    "transformers>=5.22.1",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[project.scripts]
kvcompact-replay = "kvcompact.replay:main"

[tool.pytest.ini_options]
markers = ["model: needs the Qwen3-0.6B weights (downloaded on first run)"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
